name: mexican_bulking
description: "Mexican Bulking - Your ultimate gym companion with personalized routines."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  firebase_messaging: ^15.1.5
  firebase_crashlytics: ^4.1.4
  google_sign_in: ^6.2.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.2
  carousel_slider: ^5.0.0
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.19.0
  share_plus: ^12.0.1

  # Audio
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/instalaciones/
    - assets/images/maquinas/
    - assets/images/rutinas/
    - assets/icons/
    - assets/publicidad/
    - assets/sounds/ 
